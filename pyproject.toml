[project]
name = "desk-todo"
dynamic = ["version"]
description = "A goal list pinned to the top-right corner of the Windows desktop (PySide6 + Qt Quick)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.9"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Environment :: Win32 (MS Windows)",
    "Topic :: Desktop Environment",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/zzkws/Desk-Todo"

[tool.setuptools.dynamic]
version = { attr = "desktodo.__version__" }

[tool.setuptools.packages.find]
include = ["desktodo*"]

[tool.setuptools.package-data]
desktodo = ["qml/*.qml"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["_vendor", "archive", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP031"]   # 保留 % 格式化

[tool.pytest.ini_options]
testpaths = ["tests"]
